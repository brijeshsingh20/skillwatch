<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>SkillWatch AI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0F24"/>
      <stop offset="1" stop-color="#02030A"/>
    </linearGradient>
    <linearGradient id="cb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B6BFF"/>
      <stop offset="1" stop-color="#1F4BFF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#C6FF00" stop-opacity=".55"/>
      <stop offset="1" stop-color="#C6FF00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .frame { transform-box: view-box; transform-origin: 50% 50%; animation: breathe 3.2s ease-in-out infinite; }
    .ring  { transform-box: fill-box; transform-origin: center; animation: ping 2s ease-out infinite; }
    .halo  { transform-box: fill-box; transform-origin: center; animation: halo 2s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(.93); } }
    @keyframes ping { 0% { transform: scale(1); opacity: .95; } 100% { transform: scale(2.3); opacity: 0; } }
    @keyframes halo { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .frame, .ring, .halo { animation: none; } .ring { opacity: 0; } }
  </style>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#1F4BFF" stroke-opacity=".6" stroke-width="3"/>
  <g class="frame" fill="none" stroke="url(#cb)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 27v-7q0-5 5-5h7"/>
    <path d="M49 27v-7q0-5-5-5h-7"/>
    <path d="M15 37v7q0 5 5 5h7"/>
    <path d="M49 37v7q0 5-5 5h-7"/>
  </g>
  <circle class="halo" cx="32" cy="32" r="14" fill="url(#glow)"/>
  <circle class="ring" cx="32" cy="32" r="7" fill="none" stroke="#C6FF00" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="7" fill="#C6FF00"/>
</svg>